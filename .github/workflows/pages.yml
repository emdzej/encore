name: Pages

# Builds the VitePress site in docs/ and deploys it to GitHub Pages at https://encore.emdzej.pl/.
# The custom-domain CNAME ships in docs/public/CNAME. The skills catalogue page reads skills/*/SKILL.md at
# build time, so changes to skills redeploy the site too.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'skills/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'skills/**'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # lastUpdated timestamps

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: install
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: build VitePress site
        working-directory: docs
        run: pnpm build

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - name: upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
