<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ENCORE">
  <!-- The ENCORE seal: an E drawn as scanlines, with a play notch in its spine, inside a museum medal ring. -->
  <circle cx="32" cy="32" r="30" fill="#0E1420"/>
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#E8A13A" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#E8A13A" stroke-width="0.8" stroke-dasharray="1.2 2.2"/>
  <g fill="#E8A13A">
    <!-- spine with a play-triangle notch -->
    <path d="M19 17h6v30h-6zM20.4 28.6v6.8l4.6-3.4z" fill-rule="evenodd"/>
    <!-- arms, each two scanlines -->
    <rect x="26.5" y="17" width="18.5" height="1.9"/>
    <rect x="26.5" y="20.1" width="16" height="1.9"/>
    <rect x="26.5" y="29.5" width="13" height="1.9"/>
    <rect x="26.5" y="32.6" width="10.5" height="1.9"/>
    <rect x="26.5" y="42" width="16" height="1.9"/>
    <rect x="26.5" y="45.1" width="18.5" height="1.9"/>
  </g>
</svg>
